# =============================================================================
# Vital.sandbox - Server Configuration
# =============================================================================
# This file controls the server's network, HTTP, and social settings.
# Simply modify the values below and restart the server - no code changes needed!
# =============================================================================

# Server Identity
server:
  name: "Vital.sandbox Server"
  version: "1.0.0"
  description: "A Vital.sandbox server"


# Network
network:
  # TCP port for ENet multiplayer. Default: 7777
  port: 7777

  # Maximum concurrent clients. Default: 32
  max_peers: 32

  # Physics simulation rate in Hz.
  # Sets the ceiling for sync.rate — synced entities can't update faster than physics steps them.
  # Range: 1-120. Default: 60.
  physics_tick_rate: 60


# HTTP asset delivery server
http:
  # Default: 7778
  port: 7778


# Sync
# All values are sent to clients on connect — no recompile needed.
sync:
  # How many times per second entity transforms are broadcast to clients.
  # Capped to physics_tick_rate. Default: tracks physics_tick_rate.
  #rate: 30

  # Adaptive jitter buffer ceiling in seconds.
  # LAN: 0.10  Mixed: 0.20  Global: 0.30  Lossy: 0.50+
  # Range: 0.05-1.0. Default: 0.30
  buffer_delay_max: 0.30

  # Stddev multiplier for adaptive buffer target.
  # Lower = snappier on stable links. Higher = smoother on bad ones.
  # LAN: 1.0-1.25  General: 1.5  Lossy: 2.0-3.0
  # Range: 0.5-5.0. Default: 1.5
  jitter_margin: 1.5

  # Teleport threshold in world units.
  # Gap beyond this snaps instead of interpolating.
  # Range: 0.5-100.0. Default: 5.0
  snap_threshold: 5.0


# Bootstrapper
bootstrap:
  # Resources auto-started after scan, in order.
  #- "runcode"


# Socials
social:
  discord: ""
  website: ""


# Masterlist
masterlist:
  enabled: false
  token: ""
  url: "https://vital-sandbox.com/api/masterlist"
